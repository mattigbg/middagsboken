<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Recept, veckomeny och inköpslista för familjens middagar.">
<meta name="theme-color" content="#f2f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Middagar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap brand">
    <div class="brand-l"><h1>Middags<span>boken</span></h1><button class="fam" id="fam" hidden aria-label="Familj och inbjudan"></button></div>
    <button class="sync" id="sync" aria-label="Inställningar">Startar…</button>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabbar" role="tablist" id="tabbar">
  <button role="tab" data-tab="week" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Veckomeny</span>
  </button>
  <button role="tab" data-tab="recipes" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10.5M9 8.5h6"/></svg>
    <span>Recept</span>
  </button>
  <button role="tab" data-tab="shop" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 10.5h10l2-7.5H7.2"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>
    <span>Inköpslista</span>
  </button>
</nav>

<div id="layer"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>

</html>
