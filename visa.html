<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckans middagar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Väggskärm: läses på 2–3 meters avstånd. Dagens middag stort till vänster, veckan som lista till höger. */
:root {
  --bg: #f2f5f1; --surface: #ffffff; --soft: #e5ebe4; --ink: #1b241e; --muted: #5a685f; --line: #d6ded6;
  --accent: #2c5a43; --lingon: #b02538;
  --f-display: "Bricolage Grotesque", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-body: "Source Sans 3", Roboto, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="ljus"]) { --bg: #0f1411; --surface: #171e19; --soft: #1f2822; --ink: #e8eee9; --muted: #95a39a; --line: #2a342e; --accent: #85bf9c; --lingon: #ec7383; color-scheme: dark; }
}
:root[data-tema="mörk"] { --bg: #0f1411; --surface: #171e19; --soft: #1f2822; --ink: #e8eee9; --muted: #95a39a; --line: #2a342e; --accent: #85bf9c; --lingon: #ec7383; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: clamp(14px, 1.55vw, 26px); line-height: 1.3; overflow: hidden;
  padding: max(2.2vh, env(safe-area-inset-top)) max(2.6vw, env(safe-area-inset-right)) max(2.2vh, env(safe-area-inset-bottom)) max(2.6vw, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 2.2vh;
}
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.08; text-wrap: balance; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; }
header h1 { font-size: 2.1em; letter-spacing: -.01em; }
header .sub { color: var(--muted); font-size: 1em; margin-top: .2em; }
.clock { font-family: var(--f-display); font-size: 2.1em; font-variant-numeric: tabular-nums; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 2.6vw; }
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 1.1em; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.today .img { flex: 1; min-height: 0; background: var(--soft) center / cover no-repeat; }
.today .txt { padding: 1.1em 1.3em 1.3em; }
.today.noimg .txt { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 1.6em; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; font-size: .75em; color: var(--lingon); }
.today h2 { font-size: 2.3em; margin-top: .25em; }
.today.noimg h2 { font-size: 3.1em; }
.today .meta { color: var(--muted); margin-top: .4em; font-size: 1em; }
.tomorrow { margin-top: .9em; padding-top: .8em; border-top: 1px solid var(--line); color: var(--muted); }
.tomorrow b { color: var(--ink); font-weight: 600; }
.week { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 0; }
.week li { flex: 1; display: grid; grid-template-columns: 4.4em 1fr; align-items: center; gap: 1em; border-bottom: 1px solid var(--line); min-height: 0; }
.week li:last-child { border-bottom: 0; }
.week .d { line-height: 1.1; }
.week .d b { display: block; font-family: var(--f-display); font-size: 1.05em; }
.week .d small { color: var(--muted); font-size: .8em; font-variant-numeric: tabular-nums; }
.week .n { font-size: 1.15em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.week .n.note { font-weight: 400; font-style: italic; }
.week .n.empty { color: var(--muted); font-weight: 400; }
.week li.past { opacity: .45; }
.week li.is-today .d b { color: var(--lingon); }
.week li.is-today .n { color: var(--accent); }
footer { color: var(--muted); font-size: .7em; display: flex; justify-content: space-between; }
.message { margin: auto; text-align: center; max-width: 40em; }
.message h2 { font-size: 2em; margin-bottom: .4em; }
.message p { color: var(--muted); }
@media (max-aspect-ratio: 1/1) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: minmax(40vh, 1fr) auto; }
  .week li { padding-block: 1.2vh; }
}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Veckans middagar</h1><div class="sub" id="sub"></div></div>
  <div class="clock" id="clock"></div>
</header>
<main id="main"></main>
<footer><span id="fam"></span><span id="upd"></span></footer>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var DAYS = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag", "Lördag", "Söndag"];
  var MON = ["jan", "feb", "mars", "apr", "maj", "juni", "juli", "aug", "sep", "okt", "nov", "dec"];
  var CFG = window.MIDDAG_CONFIG || {};
  var params = new URLSearchParams(location.search);
  var KEY = params.get("nyckel") || "";
  var tema = params.get("tema"); if (tema === "ljus" || tema === "mörk" || tema === "mork") document.documentElement.setAttribute("data-tema", tema === "ljus" ? "ljus" : "mörk");
  var CACHE = "mb-visa-" + KEY.slice(0, 8);

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 864e5 + 1) / 7) };
  }
  function keyOf(mon) { var w = isoWeek(mon); return w.year + "-v" + (w.week < 10 ? "0" : "") + w.week; }
  function fmt(d) { return d.getDate() + " " + MON[d.getMonth()]; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function tick() { var n = new Date(); $("clock").textContent = pad(n.getHours()) + ":" + pad(n.getMinutes()); }
  tick(); setInterval(tick, 10000);

  function message(title, text) {
    $("main").innerHTML = '<div class="message" style="grid-column:1/-1"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p></div>";
  }

  function dish(d) {
    if (!d) return null;
    if (d.name) return { name: d.name, image: d.image || "", meta: [d.time ? d.time + " min" : ""].concat((d.tags || []).slice(0, 2)).filter(Boolean).join(" · "), note: false };
    if (d.note) return { name: d.note, image: "", meta: "", note: true };
    return null;
  }

  function render(data) {
    var now = new Date(), today = new Date(now); today.setHours(0, 0, 0, 0);
    var mon = mondayOf(now), cur = keyOf(mon), next = keyOf(addDays(mon, 7));
    var w = isoWeek(mon), weeks = data.weeks || {};
    var days = weeks[cur] || [], nextDays = weeks[next] || [];
    var ti = (today.getDay() + 6) % 7;
    $("title").textContent = "Vecka " + w.week;
    $("sub").textContent = fmt(mon) + " – " + fmt(addDays(mon, 6));
    $("fam").textContent = data.family || "";
    document.title = "Middagar vecka " + w.week;

    var t = dish(days[ti]);
    var tm = ti < 6 ? dish(days[ti + 1]) : dish(nextDays[0]);
    var left = '<section class="today' + (t && t.image ? "" : " noimg") + '">' +
      (t && t.image ? '<div class="img" style="background-image:url(\'' + encodeURI(t.image).replace(/'/g, "%27") + '\')"></div>' : "") +
      '<div class="txt"><div class="eyebrow">I dag · ' + DAYS[ti] + " " + fmt(today) + "</div>" +
      "<h2>" + (t ? esc(t.name) : "Inget planerat") + "</h2>" +
      (t && t.meta ? '<div class="meta">' + esc(t.meta) + "</div>" : "") +
      (tm ? '<div class="tomorrow">I morgon: <b>' + esc(tm.name) + "</b></div>" : "") +
      "</div></section>";

    var rows = DAYS.map(function (name, i) {
      var date = addDays(mon, i), x = dish(days[i]);
      var cls = i === ti ? "is-today" : date < today ? "past" : "";
      return '<li class="' + cls + '"><div class="d"><b>' + name.slice(0, 3) + "</b><small>" + fmt(date) + "</small></div>" +
        '<div class="n' + (x ? (x.note ? " note" : "") : " empty") + '">' + (x ? esc(x.name) : "–") + "</div></li>";
    }).join("");
    $("main").innerHTML = left + '<ul class="week">' + rows + "</ul>";
    $("upd").textContent = "Uppdaterad " + pad(now.getHours()) + ":" + pad(now.getMinutes());
  }

  function load() {
    if (!KEY) { message("Länken saknar nyckel", "Öppna Middagsboken, tryck på familjens namn och kopiera länken under Väggskärm."); return; }
    if (!CFG.supabaseUrl) { message("Inte kopplad", "Appen är inte kopplad till någon databas."); return; }
    var mon = mondayOf(new Date());
    fetch(CFG.supabaseUrl + "/rest/v1/rpc/public_menu", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CFG.supabaseKey, Authorization: "Bearer " + CFG.supabaseKey },
      body: JSON.stringify({ p_key: KEY, p_weeks: [keyOf(mon), keyOf(addDays(mon, 7))] })
    }).then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (data) {
        if (!data) { message("Länken fungerar inte längre", "Ägaren har bytt eller stängt av länken. Hämta den nya länken under Väggskärm i appen."); return; }
        try { localStorage.setItem(CACHE, JSON.stringify(data)); } catch (e) {}
        render(data);
      })
      .catch(function () {
        var c = null; try { c = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
        if (c) { render(c); $("upd").textContent = "Offline, visar senast hämtade"; }
        else message("Ingen anslutning", "Försöker igen om en stund.");
      });
  }

  load();
  setInterval(load, 5 * 60 * 1000);
  // Ny dag: rita om direkt efter midnatt.
  var lastDay = new Date().getDate();
  setInterval(function () { var d = new Date().getDate(); if (d !== lastDay) { lastDay = d; load(); } }, 60000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
})();
</script>
</body>
</html>
